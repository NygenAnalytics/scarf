name: Docs

on:
  push:
    branches:
      - master
      - development
    paths:
      - "docs/**"
      - "scarf/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".readthedocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    branches:
      - master
      - development
    paths:
      - "docs/**"
      - "scarf/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".readthedocs.yml"
      - ".github/workflows/docs.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HNSWLIB_NO_NATIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libfftw3-dev libmetis-dev
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: Install documentation dependencies
        run: uv sync --extra docs --extra test --extra extra
      - name: Documentation cache tests
        run: uv run pytest -n 0 tests/test_docs_cache.py
      - name: Validate committed notebook cache
        run: uv run python docs/execute_all_vignettes.py --validate
      - name: Sphinx HTML build (nitpicky, warnings as errors)
        run: uv run sphinx-build -b html -n -W docs/source docs/build/html
      - name: Reference coverage (every public symbol documented exactly once)
        run: uv run python docs/check_reference_coverage.py
