name: Tests

on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Install system build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libigraph-dev libfftw3-dev libmetis-dev
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: uv sync --extra test --extra extra
    - name: Test with pytest (parallel)
      run: |
        uv run pytest \
          -n auto \
          --dist loadfile \
          --cov=scarf \
          --cov-report=xml \
          --cov-report=term
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        fail_ci_if_error: false
