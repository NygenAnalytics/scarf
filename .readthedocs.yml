version: 2

build:
  os: ubuntu-26.04
  tools:
    python: "3.14"
  jobs:
    post_checkout:
      - git fetch --unshallow || true
      - git fetch --tags --force
    pre_build:
      - uv run python docs/execute_all_vignettes.py --validate

python:
  install:
    - method: uv
      command: sync
      extras:
        - docs
        - extra

sphinx:
  configuration: docs/source/conf.py
  builder: html
  fail_on_warning: true
