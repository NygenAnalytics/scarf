[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scarf"
dynamic = ["version"]
description = "Scarf: A scalable tool for single-cell omics data analysis"
readme = {file = "pypi_README.rst", content-type = "text/x-rst"}
requires-python = ">=3.14"
license = "BSD-3-Clause"
authors = [
    {name = "Parashar Dhapola", email = "parashar.dhapola@gmail.com"},
]
keywords = ["single-cell"]
classifiers = [
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "h5py>=3.16",
    "hnswlib",
    "leidenalg",
    "loguru",
    "networkx",
    "numba>=0.65",
    "numcodecs>=0.16",
    "numpy>=2.4",
    "packaging",
    "pandas>=2.3",
    "scikit-learn>=1.9",
    "scikit-network>=0.33.5",
    "scipy>=1.18",
    "setuptools",
    "statsmodels",
    "threadpoolctl",
    "tqdm",
    "umap-learn",
    "zarr>=3.0",
    "obstore",
    "sgtsnepi",
]

[project.optional-dependencies]
extra = [
    "requests",
    "kneed",
    "matplotlib",
    "seaborn",
    "cmocean",
    "datashader",
    "ipython-autotime",
    "ipywidgets",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "topacedo",
    "anndata",
]
docs = [
    "jinja2",
    "jedi",
    "myst-parser",
    "myst-nb",
    "sphinx",
    "sphinx_autodoc_typehints",
    "sphinx-book-theme",
    "sphinx-copybutton",
    "sphinx-external-toc",
    "sphinx-tabs",
    "topacedo",
    "nbclient",
]

[project.urls]
Homepage = "https://github.com/parashardhapola/scarf"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
exclude = ["tests*"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -v -m 'not integration' -n auto --dist loadfile"
markers = [
    "integration: live network tests (OSF downloader, R2 benchmarks)",
]
testpaths = [
    "tests",
]
norecursedirs = [
    "datasets",
]

[tool.coverage.run]
source = ["scarf"]
parallel = true

[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = true
ignore-private = true
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = true
ignore-setters = false
fail-under = 50
exclude = [
    "setup.py",
    "docs",
    "tests"
]
ignore-regex = [
    "^get$",
    "^mock_.*",
    ".*BaseClass.*"
]
verbose = 2
quiet = false
whitelist-regex = []
color = true
generate-badge = '.'
badge-format = "svg"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.20",
]

[tool.mypy]
strict = false

python_version = "3.14"

disable_error_code = ["import-untyped"]

disallow_untyped_defs = true
disallow_incomplete_defs = true

check_untyped_defs = true
disallow_untyped_calls = true
no_implicit_optional = true

warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false

ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "scarf.plots"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
warn_return_any = false
ignore_errors = true
