# Copy to profiling/config.toml and replace secret, region, endpoint, bucket, and prefixes.

modalEnvironmentName = "scarf_profiling"
modalAppName = "scarf-profiling"
modalSecretName = "replace-with-modal-secret"
modalRegion = "eu"
r2EndpointUrl = "https://replace-with-account-id.r2.cloudflarestorage.com"
datasetPrefixUri = "s3://example-bucket/scarf-profiling/datasets"
resultsUri = "s3://example-bucket/scarf-profiling"
# Optional: isolate stores/results under stores/<runTag>/ and results/<runTag>/.
# runTag = "replace-with-a-fresh-run-tag"
#
# [countMatrix]
# unitBytes = 1000000000
# chunkBytes = 100000000
#
# Leave storageIo unset to use the memory-admitted product defaults. Set all
# three values only for an isolated policy experiment.
# [storageIo]
# readWorkers = 8
# computeWorkers = 4
# writeWorkers = 4
targetSizes = [
    10000,
    25000,
    50000,
    100000,
    250000,
    500000,
    1000000,
    2500000,
    5000000,
    10000000,
]
samplingSeed = 0

# Full Cellxgene prepare loads CSR into RAM (indices downcast to int32).
[prepareResources]
modalMemoryRequestMb = 196608
modalMemoryLimitMb = 212992
modalCpuRequest = 8.0
modalCpuLimit = 16.0
timeoutSeconds = 86400
ephemeralDiskMb = 524288

[workflow]
assayName = "RNA"
cellKey = "I"
filterAttrs = [
    "RNA_nCounts",
    "RNA_nFeatures",
    "RNA_percentMito",
    "RNA_percentRibo",
]
filterMinQuantile = 0.01
filterMaxQuantile = 0.99
minFeaturesPerCell = 10
h5adBatchSize = 1000
topN = 1000
hvgMinCells = 20
k = 11
dims = 21
nCentroids = 1000
graphSeed = 4466
annParallel = false
umapEpochs = 300
umapSeed = 4444
umapParallel = false
leidenResolution = 1.0
leidenBackend = "igraph"
leidenSeed = 4444
graphLocalCache = "auto"

# For a selected-run marker branch, provide both the source store and its
# immutable cluster_labels artifact. Per-size sources may instead be placed in
# the ignored profiling/cluster_sources.toml file as nRows, storeUri, artifactId.
# clusterSourceUri = "s3://example-bucket/scarf-profiling/stores/core/10000.zarr"
# clusterSourceArtifactId = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

# Tune memory before large runs. Values are examples.

# Pin createStore / writeCountsT / markHvgs / findMarkers to 8 CPU / 32 GiB
# (scarf budget ~24 GiB). Other stages keep larger envelopes.
[stageResources.createStore]
modalMemoryRequestMb = 32768
modalMemoryLimitMb = 32768
modalCpuRequest = 8.0
modalCpuLimit = 8.0
scarfMemoryBudget = 25769803776
workers = 8
timeoutSeconds = 82800
ephemeralDiskMb = 524288

