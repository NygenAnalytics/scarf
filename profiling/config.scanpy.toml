# Copy to profiling/config.scanpy.toml and replace secret, region, endpoint,
# bucket, and prefixes. Tuned for Scanpy dask e2e on an 8 CPU / 64 GiB Modal box.
#
# Peer fairness notes (also written into funnel.json comparisonNotes):
# - HVG n_top_genes=2000, PCA n_comps=50 (match Scarf)
# - normalize_total target_sum=1e4 (Scanpy published default; Scarf uses sf=1000)
# - Scarf e2e wall time should include createStore + writeCountsT
# - Paris is skipped on the Scanpy peer
# - Cell filter approximates Scarf 1st/99th QC quantiles
# - 32 GiB was insufficient for calculate_qc_metrics at 1M; use 64 GiB

modalEnvironmentName = "scarf_profiling"
modalAppName = "scarf-profiling-scanpy"
modalSecretName = "scarf-r2"
modalRegion = "eu"
r2EndpointUrl = "https://8a09aa0b1ce3614588bfcd221d8c183e.r2.cloudflarestorage.com"
datasetPrefixUri = "s3://scarf-tests/scarf-profiling/datasets"
resultsUri = "s3://scarf-tests/scarf-profiling"
# Isolate Scanpy results under results/<runTag>/
runTag = "scanpy_dask_c8_m64_w1"
targetSizes = [
    10000,
    25000,
    50000,
    100000,
    250000,
    500000,
    1000000,
]

[workflow]
nTopGenes = 2000
nComps = 50
nNeighbors = 11
umapEpochs = 300
umapSeed = 4444
leidenResolution = 1.0
leidenSeed = 4444
leidenNIterations = 2
leidenFlavor = "igraph"
targetSum = 10000.0
filterMinQuantile = 0.01
filterMaxQuantile = 0.99
minGenesPerCell = 10
minCellsPerGene = 20
hvgFlavor = "seurat"
neighborsTransformer = "annoy"
rankMethod = "wilcoxon"
featureNameKey = "feature_name"

# Dask LocalCluster knobs for the 8 CPU / 64 GiB envelope.
# Docs recommend threads_per_worker=1 and tuning workers vs chunk size.
[dask]
nWorkers = 1
threadsPerWorker = 1
memoryPerWorker = "50GB"
sparseChunkSize = 20000
processes = true

[resources]
modalMemoryRequestMb = 65536
modalMemoryLimitMb = 65536
modalCpuRequest = 8.0
modalCpuLimit = 8.0
timeoutSeconds = 86400
ephemeralDiskMb = 524288
